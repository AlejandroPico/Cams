name: Sonda Windy

# Diagnostico manual. No toca el catalogo ni despliega nada: solo consulta la API
# de Windy y muestra la forma de la respuesta en el registro de ejecucion.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/catalog/windy_probe.py"
      - ".github/workflows/windy-probe.yml"


permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Consultar la Webcams API
        env:
          WINDY_WEBCAMS_KEY: ${{ secrets.WINDY_WEBCAMS_KEY }}
        run: python scripts/catalog/windy_probe.py 2>&1 | tee /tmp/salida.txt
      - name: Guardar el resultado en el repositorio
        if: always()
        run: |
          mkdir -p docs/diagnostics
          mv /tmp/salida.txt docs/diagnostics/windy-probe.txt
          if [ -z "$(git status --porcelain -- docs/diagnostics)" ]; then
            echo "Sin cambios en el diagnostico"
            exit 0
          fi
          git config user.name "cams-catalog-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/diagnostics
          git commit -m "Guardar diagnostico de la sonda de Windy [skip ci]"
          git pull --rebase origin main
          git push
