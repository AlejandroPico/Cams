name: Deploy Cams

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
  workflow_dispatch:
  workflow_run:
    workflows: [Refresh public camera database, Sincronizar Windy Webcams, Verificar imagenes]
    types: [completed]
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install frontend dependencies
        run: npm ci --no-audit --no-fund
      - name: Validate SQLite and exported catalog
        run: |
          python - <<'PY'
          import json
          import sqlite3
          from pathlib import Path

          db_path = Path("data/cams.sqlite3")
          json_path = Path("public/data/cameras.json")
          seed_path = Path("src/data/catalog.seed.json")

          for path in (db_path, json_path, seed_path):
              if not path.is_file() or path.stat().st_size == 0:
                  raise SystemExit(f"Required catalog artifact is missing or empty: {path}")

          with sqlite3.connect(db_path) as connection:
              integrity = connection.execute("PRAGMA integrity_check").fetchone()[0]
              if integrity != "ok":
                  raise SystemExit(f"SQLite integrity check failed: {integrity}")
              database_count = connection.execute(
                  "SELECT COUNT(*) FROM cameras WHERE active=1 AND is_public=1"
              ).fetchone()[0]
              provider_counts = connection.execute(
                  "SELECT p.code, COUNT(*) FROM cameras c JOIN providers p ON p.id=c.provider_id "
                  "WHERE c.active=1 AND c.is_public=1 GROUP BY p.code ORDER BY COUNT(*) DESC"
              ).fetchall()

          exported = json.loads(json_path.read_text(encoding="utf-8")).get("cameras", [])
          bundled = json.loads(seed_path.read_text(encoding="utf-8")).get("cameras", [])

          if database_count < 100:
              raise SystemExit(f"Catalog regression: only {database_count} cameras were generated")
          if len(exported) != database_count:
              raise SystemExit(
                  f"Catalog mismatch: SQLite={database_count}, public JSON={len(exported)}"
              )
          # El catalogo integrado es solo una muestra de emergencia, no una copia.
          if not bundled or len(bundled) > database_count:
              raise SystemExit(f"Fallback invalido: {len(bundled)} sobre {database_count}")

          print(f"Validated {database_count} cameras")
          for provider, count in provider_counts:
              print(f"  {provider}: {count}")
          PY
      - name: Build production site
        run: npm run build
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist
          retention-days: 1

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 10
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

