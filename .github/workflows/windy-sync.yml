name: Sincronizar Windy Webcams

# Recorrido completo de la Webcams API de Windy. Va aparte del refresco general
# porque son unas 1.700 peticiones y las camaras de paisaje y turismo cambian mucho
# mas despacio que las de trafico: no tiene sentido repetirlo cada seis horas.
on:
  schedule:
    - cron: "40 3 * * *"
  workflow_dispatch:
  # Tambien al tocar el adaptador, para que un cambio en el codigo se vea sin
  # tener que lanzar el workflow a mano desde la interfaz.
  push:
    branches: [main]
    paths:
      - "scripts/catalog/windy_catalog.py"
      - ".github/workflows/windy-sync.yml"

permissions:
  contents: write

# Grupo propio: el refresco general usa cancel-in-progress y cancelaria esta
# sincronizacion a media ejecucion, que dura bastante mas que el resto.
# Grupo versionado a proposito: una ejecucion anterior con un limite de 330 minutos
# se quedo ocupando el grupo antiguo, y todo lo que se enviaba despues se encolaba
# detras sin llegar a ejecutarse. Cambiar el nombre libera la cola.
concurrency:
  group: windy-sync-v2
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Importar camaras de Windy
        env:
          WINDY_WEBCAMS_KEY: ${{ secrets.WINDY_WEBCAMS_KEY }}
          # Por debajo del timeout del trabajo, para que pare por las buenas, guarde
          # lo recogido y anote por donde continuar, en vez de morir sin dejar rastro.
          # Corto a proposito: interesa mas tener respuesta en minutos y que la
          # reanudacion vaya completando el catalogo entre varias pasadas, que
          # una unica ejecucion larga de la que no sabemos nada hasta el final.
          WINDY_TIME_BUDGET_MIN: "25"
        run: python scripts/catalog/windy_catalog.py 2>&1 | tee /tmp/windy.txt
      - name: Guardar el registro de la sincronizacion
        if: always()
        run: |
          mkdir -p docs/diagnostics
          tail -c 60000 /tmp/windy.txt > docs/diagnostics/windy-sync.txt || true
      - name: Ocultar camaras duplicadas de fuentes oficiales
        run: python scripts/catalog/dedupe_catalog.py
      - name: Regenerar estadisticas del catalogo
        # windy_catalog.py exporta el catalogo con su propio informe, lo que dejaria
        # catalog-meta.json sin providerHealth ni desglose por paises. Este paso lo
        # reconstruye entero, igual que hace run_catalog.py.
        run: python scripts/catalog/catalog_stats.py
      - name: Verificar integridad de SQLite
        run: |
          python - <<'PY'
          import sqlite3
          from pathlib import Path

          path = Path("data/cams.sqlite3")
          if not path.is_file() or path.stat().st_size == 0:
              raise SystemExit("data/cams.sqlite3 no se ha generado")
          with sqlite3.connect(path) as connection:
              result = connection.execute("PRAGMA integrity_check").fetchone()[0]
              if result != "ok":
                  raise SystemExit(f"Integridad de SQLite fallida: {result}")
              total = connection.execute(
                  "SELECT COUNT(*) FROM cameras WHERE active=1 AND is_public=1"
              ).fetchone()[0]
              windy = connection.execute(
                  "SELECT COUNT(*) FROM cameras c JOIN providers p ON p.id=c.provider_id "
                  "WHERE p.code='WINDY_WEBCAMS' AND c.active=1"
              ).fetchone()[0]
              countries = connection.execute(
                  "SELECT COUNT(DISTINCT country_code) FROM cameras WHERE active=1"
              ).fetchone()[0]
          if total < 100:
              raise SystemExit(f"Regresion del catalogo: solo {total} camaras")
          print(f"SQLite valido: {total} camaras publicas, {windy} de Windy, {countries} paises")
          PY
      - name: Guardar catalogo actualizado
        if: always()
        run: |
          set -e
          GEN="data/cams.sqlite3 data/windy-resume.txt public/data src/data/catalog.seed.json docs/diagnostics"
          if [ -z "$(git status --porcelain -- $GEN)" ]; then
            echo "Sin cambios en el catalogo"
            exit 0
          fi

          git config user.name "cams-catalog-bot"
          git config user.email "actions@users.noreply.github.com"

          # Los ficheros generados no se pueden fusionar: son un SQLite binario y
          # JSON de decenas de MB. Rebasar sobre lo que haya subido el deploy mientras
          # tanto produce conflictos irresolubles. Se apartan, se sincroniza el codigo
          # con el remoto y se vuelven a colocar: en lo generado manda siempre esta
          # ejecucion, que es la que acaba de calcularlo.
          for intento in 1 2 3 4 5; do
            rm -rf /tmp/generado && mkdir -p /tmp/generado
            for ruta in $GEN; do
              if [ -e "$ruta" ]; then
                mkdir -p "/tmp/generado/$(dirname "$ruta")"
                cp -r "$ruta" "/tmp/generado/$(dirname "$ruta")/"
              fi
            done

            git fetch origin main
            git reset --hard origin/main

            for ruta in $GEN; do
              if [ -e "/tmp/generado/$ruta" ]; then
                mkdir -p "$(dirname "$ruta")"
                rm -rf "$ruta"
                cp -r "/tmp/generado/$ruta" "$ruta"
              fi
            done

            git add $GEN
            if git diff --cached --quiet; then
              echo "El remoto ya contiene este catalogo"
              exit 0
            fi
            git commit -m "Sincronizar camaras de Windy Webcams"
            if git push origin HEAD:main; then
              echo "Catalogo publicado en el intento $intento"
              exit 0
            fi
            echo "El remoto se movio durante el envio; reintentando"
            sleep 10
          done
          echo "No se pudo publicar el catalogo tras varios intentos" >&2
          exit 1
