name: Sincronizar Windy Webcams

# Recorrido completo de la Webcams API de Windy. Va aparte del refresco general
# porque son unas 1.700 peticiones y las camaras de paisaje y turismo cambian mucho
# mas despacio que las de trafico: no tiene sentido repetirlo cada seis horas.
on:
  schedule:
    - cron: "40 3 * * *"
  workflow_dispatch:
  # Tambien al tocar el adaptador, para que un cambio en el codigo se vea sin
  # tener que lanzar el workflow a mano desde la interfaz.
  push:
    branches: [main]
    paths:
      - "scripts/catalog/windy_catalog.py"
      - ".github/workflows/windy-sync.yml"

permissions:
  contents: write

# Grupo propio: el refresco general usa cancel-in-progress y cancelaria esta
# sincronizacion a media ejecucion, que dura bastante mas que el resto.
concurrency:
  group: windy-catalog
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Importar camaras de Windy
        env:
          WINDY_WEBCAMS_KEY: ${{ secrets.WINDY_WEBCAMS_KEY }}
        run: python scripts/catalog/windy_catalog.py 2>&1 | tee /tmp/windy.txt
      - name: Guardar el registro de la sincronizacion
        if: always()
        run: |
          mkdir -p docs/diagnostics
          tail -c 60000 /tmp/windy.txt > docs/diagnostics/windy-sync.txt || true
      - name: Ocultar camaras duplicadas de fuentes oficiales
        run: python scripts/catalog/dedupe_catalog.py
      - name: Regenerar estadisticas del catalogo
        # windy_catalog.py exporta el catalogo con su propio informe, lo que dejaria
        # catalog-meta.json sin providerHealth ni desglose por paises. Este paso lo
        # reconstruye entero, igual que hace run_catalog.py.
        run: python scripts/catalog/catalog_stats.py
      - name: Verificar integridad de SQLite
        run: |
          python - <<'PY'
          import sqlite3
          from pathlib import Path

          path = Path("data/cams.sqlite3")
          if not path.is_file() or path.stat().st_size == 0:
              raise SystemExit("data/cams.sqlite3 no se ha generado")
          with sqlite3.connect(path) as connection:
              result = connection.execute("PRAGMA integrity_check").fetchone()[0]
              if result != "ok":
                  raise SystemExit(f"Integridad de SQLite fallida: {result}")
              total = connection.execute(
                  "SELECT COUNT(*) FROM cameras WHERE active=1 AND is_public=1"
              ).fetchone()[0]
              windy = connection.execute(
                  "SELECT COUNT(*) FROM cameras c JOIN providers p ON p.id=c.provider_id "
                  "WHERE p.code='WINDY_WEBCAMS' AND c.active=1"
              ).fetchone()[0]
              countries = connection.execute(
                  "SELECT COUNT(DISTINCT country_code) FROM cameras WHERE active=1"
              ).fetchone()[0]
          if total < 100:
              raise SystemExit(f"Regresion del catalogo: solo {total} camaras")
          print(f"SQLite valido: {total} camaras publicas, {windy} de Windy, {countries} paises")
          PY
      - name: Guardar catalogo actualizado
        if: always()
        run: |
          if [ -z "$(git status --porcelain -- data/cams.sqlite3 public/data src/data/catalog.seed.json docs/diagnostics)" ]; then
            echo "Sin cambios en el catalogo"
            exit 0
          fi
          git config user.name "cams-catalog-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/cams.sqlite3 public/data src/data/catalog.seed.json docs/diagnostics
          git commit -m "Sincronizar camaras de Windy Webcams"
          # El refresco de cada seis horas puede haber empujado mientras tanto.
          git pull --rebase origin main
          git push
