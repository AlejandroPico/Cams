name: Verificar imagenes

# Comprueba por muestreo que las imagenes cargan de verdad. Va aparte del refresco
# del catalogo porque descarga miles de imagenes de terceros y conviene espaciarlo.
on:
  schedule:
    - cron: "25 5 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/ingest/verify_images.py"
      - ".github/workflows/verify-images.yml"

permissions:
  contents: write

concurrency:
  group: verify-images
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Comprobar snapshots
        run: python scripts/ingest/verify_images.py 2>&1 | tee /tmp/verify.txt
      - name: Guardar el registro
        if: always()
        run: |
          mkdir -p docs/diagnostics
          tail -c 40000 /tmp/verify.txt > docs/diagnostics/verify-images.txt || true
      - name: Regenerar catalogo con los estados comprobados
        run: |
          python - <<'PY'
          import sys
          from contextlib import closing
          sys.path.insert(0, "scripts/catalog")
          import build_catalog as base
          with closing(base.ensure_database()) as connection:
              base.export_catalog(connection, [])
          PY
          python scripts/catalog/catalog_stats.py
      - name: Guardar resultados
        if: always()
        run: |
          set -e
          GEN="data/cams.sqlite3 public/data src/data/catalog.seed.json docs/diagnostics"
          if [ -z "$(git status --porcelain -- $GEN)" ]; then
            echo "Sin cambios"
            exit 0
          fi
          git config user.name "cams-catalog-bot"
          git config user.email "actions@users.noreply.github.com"
          for intento in 1 2 3 4 5; do
            rm -rf /tmp/generado && mkdir -p /tmp/generado
            for ruta in $GEN; do
              if [ -e "$ruta" ]; then
                mkdir -p "/tmp/generado/$(dirname "$ruta")"
                cp -r "$ruta" "/tmp/generado/$(dirname "$ruta")/"
              fi
            done
            git fetch origin main
            git reset --hard origin/main
            for ruta in $GEN; do
              if [ -e "/tmp/generado/$ruta" ]; then
                mkdir -p "$(dirname "$ruta")"
                rm -rf "$ruta"
                cp -r "/tmp/generado/$ruta" "$ruta"
              fi
            done
            git add $GEN
            if git diff --cached --quiet; then exit 0; fi
            git commit -m "Actualizar estado verificado de las imagenes"
            if git push origin HEAD:main; then exit 0; fi
            sleep 10
          done
          exit 1
