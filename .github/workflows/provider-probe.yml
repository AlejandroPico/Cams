name: Sonda de proveedores caidos

# Diagnostico manual. No toca el catalogo ni despliega: prueba endpoints candidatos
# de los proveedores rotos y muestra la forma de su respuesta.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/catalog/provider_probe.py"

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Probar endpoints
        run: python scripts/catalog/provider_probe.py 2>&1 | tee /tmp/salida.txt
      - name: Guardar el resultado en el repositorio
        if: always()
        run: |
          mkdir -p docs/diagnostics
          mv /tmp/salida.txt docs/diagnostics/provider-probe.txt
          if [ -z "$(git status --porcelain -- docs/diagnostics)" ]; then
            echo "Sin cambios en el diagnostico"
            exit 0
          fi
          git config user.name "cams-catalog-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/diagnostics
          git commit -m "Guardar diagnostico de la sonda de proveedores [skip ci]"
          git pull --rebase origin main
          git push
